  background:rgba(15,8,35,0.88);
  border:1.5px solid rgba(180,120,220,0.4);
  border-radius:10px;
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.stat-item{text-align:center;flex:1;}
.stat-label{color:rgba(255,255,255,0.6);font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:900;letter-spacing:1px;}
.temp{color:#E53935;}.sleep{color:#FFC107;}.syllabus{color:#4CAF50;}
.mental{color:rgba(255,255,255,0.7);font-size:13px;line-height:1.4;}
.mental-dots{display:flex;gap:4px;margin-top:4px;justify-content:center;}
.mental-dots span{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.4);}
.enter-btn{
  background:#E91E8C;color:#fff;border:none;
  padding:14px 28px;border-radius:8px;
  font-family:'Courier New',monospace;font-size:13px;font-weight:900;
  letter-spacing:2px;cursor:pointer;white-space:nowrap;
  text-transform:uppercase;flex-shrink:0;
  animation:pulse-btn 2s infinite;
}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 0 0 rgba(233,30,140,0.5);}50%{box-shadow:0 0 0 8px rgba(233,30,140,0);}}
.enter-btn:hover{background:#c2185b;transform:scale(1.03);}
.footer-bar{display:flex;justify-content:space-between;padding:0 28px 14px;}
.footer-txt{color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:1px;}
.footer-heart{color:#E53935;}

/* ===== INFO SCREEN ===== */
#infoScreen{
  width:100%;height:100%;position:absolute;top:0;left:0;
  background:rgba(13,8,26,0.96);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;
}
.info-box{
  background:rgba(20,12,40,0.98);
  border:1.5px solid rgba(180,120,220,0.45);
  border-radius:14px;padding:36px 40px;
  width:min(460px,90%);text-align:center;
}
.info-title{color:#E53935;font-size:19px;font-weight:900;letter-spacing:2px;margin-bottom:6px;}
.info-sub{color:rgba(255,255,255,0.45);font-size:11px;letter-spacing:1px;margin-bottom:26px;line-height:1.6;}
.info-field{margin-bottom:16px;text-align:left;}
.info-field label{display:block;color:rgba(255,255,255,0.45);font-size:10px;letter-spacing:2px;margin-bottom:6px;}
.info-field input{
  width:100%;background:rgba(255,255,255,0.05);
  border:1px solid rgba(180,120,220,0.3);
  border-radius:6px;padding:10px 14px;
  color:#fff;font-family:'Courier New',monospace;font-size:14px;
  outline:none;
}
.info-field input:focus{border-color:#E53935;}
.info-field input::placeholder{color:rgba(255,255,255,0.18);}
.go-btn{
  width:100%;background:#E53935;color:#fff;border:none;
  padding:14px;border-radius:8px;margin-top:6px;
  font-family:'Courier New',monospace;font-size:13px;font-weight:900;
  letter-spacing:2px;cursor:pointer;
}
.go-btn:hover{background:#c62828;}
.go-btn:disabled{background:rgba(229,57,53,0.25);cursor:default;color:rgba(255,255,255,0.3);}
.info-skip{color:rgba(255,255,255,0.2);font-size:11px;cursor:pointer;margin-top:10px;display:block;letter-spacing:1px;}
.info-skip:hover{color:rgba(255,255,255,0.45);}

/* ===== GAME SCREEN ===== */
#gameScreen{
  width:100%;height:100%;position:absolute;top:0;left:0;
  background:#0d0d1a;display:none;
}
#cv{display:block;width:100%;height:100%;}
#gameUI{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:5;}
.g-topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;}
.g-stat{color:#fff;font-size:13px;font-weight:700;font-family:'Courier New',monospace;}
.g-stat span{color:#E53935;}
#cgpa-box{background:rgba(229,57,53,0.18);border:1px solid #E53935;border-radius:6px;padding:4px 10px;font-family:'Courier New',monospace;}
#cgpa-val{color:#E53935;font-weight:900;font-size:15px;}
#energy-wrap{position:absolute;top:42px;left:16px;right:16px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;}
#energy-bar{height:100%;border-radius:3px;background:#4CAF50;transition:width 0.3s;}
#energy-lbl{position:absolute;top:52px;left:16px;color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:1px;}
#endOverlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;font-family:'Courier New',monospace;
}
#endOverlay h2{color:#E53935;font-size:22px;letter-spacing:3px;margin-bottom:6px;}
#end-score{color:rgba(255,255,255,0.45);font-size:13px;margin-bottom:18px;letter-spacing:1px;}
#reward-card{
  background:rgba(229,57,53,0.1);border:1.5px solid #E53935;
  border-radius:12px;padding:24px 36px;text-align:center;margin-bottom:20px;min-width:280px;
}
#rw-tier{font-size:16px;font-weight:900;color:#E53935;margin-bottom:8px;letter-spacing:2px;}
#rw-disc{font-size:26px;font-weight:900;color:#fff;margin-bottom:6px;}
#rw-extra{font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:1px;}
.end-btns{display:flex;gap:12px;}
.end-btn{padding:12px 24px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;border:none;}
#retryBtn{background:#E53935;color:#fff;}
#homeBtn{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.12);}
</style>
</head>
<body>
<div id="app">

<!-- HOME SCREEN -->
<div id="homeScreen">
  <div class="home-ui">
    <div class="top-bar">
      <div class="zomato-logo">zomato</div>
      <div class="exam-mode">DU EXAM MODE <span class="dot-red"></span></div>
    </div>
    <div></div>
    <div>
      <div class="bottom-panel">
        <div class="stat-item"><div class="stat-label">TEMPERATURE</div><div class="stat-val temp">43°C</div></div>
        <div class="stat-item"><div class="stat-label">SLEEP</div><div class="stat-val sleep">2%</div></div>
        <button class="enter-btn" onclick="showInfo()">ENTER SURVIVAL MODE</button>
        <div class="stat-item"><div class="stat-label">SYLLABUS</div><div class="stat-val syllabus">74%</div></div>
        <div class="stat-item">
          <div class="stat-label">MENTAL STABILITY</div>
          <div class="mental">LOADING...</div>
          <div class="mental-dots"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="footer-bar">
        <span class="footer-txt">MADE FOR DU STUDENTS BY ZOMATO <span class="footer-heart">&#9829;</span></span>
        <span class="footer-txt">YOU GOT THIS (WE ORDER TOO)</span>
      </div>
    </div>
  </div>
</div>

<!-- INFO SCREEN -->
<div id="infoScreen">
  <div class="info-box">
    <div class="info-title">BEFORE YOU SURVIVE...</div>
    <div class="info-sub">TELL US YOUR NEXT EXAM —<br>WE'LL FUEL YOUR ALL NIGHTER</div>
    <div class="info-field">
      <label>NEXT PAPER / SUBJECT</label>
      <input type="text" id="paperName" placeholder="e.g. Economics, DSE Paper III..." oninput="checkForm()">
    </div>
    <div class="info-field">
      <label>EXAM DATE</label>
      <input type="date" id="examDate" oninput="checkForm()" style="color-scheme:dark;">
    </div>
    <button class="go-btn" id="goBtn" onclick="launchGame()" disabled>START SURVIVAL RUN ▶</button>
    <span class="info-skip" onclick="launchGame()">Skip — just let me play</span>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <canvas id="cv"></canvas>
  <div id="gameUI">
    <div class="g-topbar">
      <div class="g-stat">SCORE: <span id="sc">0</span></div>
      <div id="cgpa-box">CGPA: <span id="cgpa-val">7.00</span></div>
      <div class="g-stat">LVL: <span id="lv">1</span></div>
    </div>
    <div id="energy-wrap"><div id="energy-bar" style="width:100%"></div></div>
    <div id="energy-lbl">MENTAL ENERGY</div>
  </div>
  <div id="endOverlay">
    <h2>GAME OVER</h2>
    <div id="end-score"></div>
    <div id="reward-card">
      <div id="rw-tier"></div>
      <div id="rw-disc"></div>
      <div id="rw-extra"></div>
    </div>
    <div class="end-btns">
      <button class="end-btn" id="retryBtn" onclick="startGame()">RETRY</button>
      <button class="end-btn" id="homeBtn" onclick="goHome()">HOME</button>
    </div>
  </div>
</div>

</div>
<script>
function showInfo(){
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('infoScreen').style.display='flex';
}
function checkForm(){
  const p=document.getElementById('paperName').value.trim();
  const d=document.getElementById('examDate').value;
  document.getElementById('goBtn').disabled=!(p&&d);
}
function goHome(){
  document.getElementById('endOverlay').style.display='none';
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('homeScreen').style.display='block';
}
function launchGame(){
  document.getElementById('infoScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  startGame();
}

const canvas=document.getElementById('cv');
const ctx=canvas.getContext('2d');
let W,H,raf,gameRunning=false;
let score=0,cgpa=7.0,energy=100,level=1,frame=0;
let player,obstacles=[],particles=[];
let doubleJump=false,jumpCount=0,chaiShield=false,shieldTimer=0;
let bgStars=[];
const GND_RATIO=0.74;

function resize(){
  const gs=document.getElementById('gameScreen');
  W=canvas.width=gs.offsetWidth;
  H=canvas.height=gs.offsetHeight;
}
function initStars(){
  bgStars=[];
  for(let i=0;i<70;i++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.65,r:Math.random()*1.5+0.4,tw:Math.random()*60});
}
function startGame(){
  document.getElementById('endOverlay').style.display='none';
  resize();initStars();
  gameRunning=true;score=0;cgpa=7.0;energy=100;level=1;frame=0;
  obstacles=[];particles=[];doubleJump=false;jumpCount=0;chaiShield=false;shieldTimer=0;
  const gnd=H*GND_RATIO;
  player={x:80,y:gnd,w:36,h:48,vy:0,onGround:true};
  cancelAnimationFrame(raf);loop();
}
const OBSTACLES=[
  {label:'Assignment',emoji:'📋',color:'#EF5350',w:28,h:52,cgpaHit:-0.15},
  {label:'Reels',emoji:'📱',color:'#AB47BC',w:22,h:38,cgpaHit:-0.10},
  {label:'Power Cut',emoji:'🔦',color:'#5C6BC0',w:30,h:44,cgpaHit:-0.12},
  {label:'Proxy',emoji:'👻',color:'#FF7043',w:26,h:44,cgpaHit:-0.10},
  {label:'Viva',emoji:'😰',color:'#E53935',w:28,h:58,cgpaHit:-0.20},
];
const POWERUPS=[
  {label:'Zomato',color:'#E53935',w:30,h:30,type:'zomato'},
  {label:'Chai',color:'#F57F17',w:26,h:26,type:'chai'},
  {label:'CGPA+',color:'#43A047',w:26,h:26,type:'cgpa'},
  {label:'Energy',color:'#1976D2',w:26,h:26,type:'energy'},
];
function spawnObs(){
  const t=OBSTACLES[Math.floor(Math.random()*OBSTACLES.length)];
  const gnd=H*GND_RATIO;
  obstacles.push({...t,x:W+20,y:gnd-t.h+4,isPow:false});
}
function spawnPow(){
  const t=POWERUPS[Math.floor(Math.random()*POWERUPS.length)];
  const gnd=H*GND_RATIO;
  obstacles.push({...t,x:W+20,y:gnd-t.h-50-Math.random()*40,isPow:true});
}
function jump(){
  if(!gameRunning)return;
  if(player.onGround){player.vy=-15;player.onGround=false;jumpCount=1;}
  else if(doubleJump&&jumpCount<2){player.vy=-13;jumpCount=2;}
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
document.getElementById('gameScreen').addEventListener('click',e=>{
  if(e.target.closest('#endOverlay'))return;jump();
});
function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('cgpa-val').textContent=Math.max(0,cgpa).toFixed(2);
  document.getElementById('lv').textContent=level;
  const ep=Math.max(0,energy);
  document.getElementById('energy-bar').style.width=ep+'%';
  document.getElementById('energy-bar').style.background=ep>50?'#4CAF50':ep>25?'#FFC107':'#E53935';
}
function addParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:40,color,isTxt:false});
  }
}
function showFloaty(x,y,txt,color){
  particles.push({x,y,vx:0,vy:-1.5,life:70,color,txt,isTxt:true});
}
function drawBg(){
  const gnd=H*GND_RATIO;
  const sky=ctx.createLinearGradient(0,0,0,gnd);
  sky.addColorStop(0,'#080818');sky.addColorStop(1,'#1a0a35');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,gnd);
  bgStars.forEach(s=>{
    const tw=0.5+0.5*Math.sin((frame+s.tw)/22);
    ctx.globalAlpha=tw*0.85;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.fillStyle='#f0e68c';ctx.beginPath();ctx.arc(W*0.85,H*0.12,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a0a35';ctx.beginPath();ctx.arc(W*0.85-8,H*0.12-4,18,0,Math.PI*2);ctx.fill();
  const bldgs=[{x:0.0,w:0.08,h:0.22},{x:0.09,w:0.06,h:0.30},{x:0.16,w:0.09,h:0.18},{x:0.27,w:0.07,h:0.26},{x:0.35,w:0.06,h:0.20},{x:0.42,w:0.08,h:0.28},{x:0.52,w:0.06,h:0.22},{x:0.59,w:0.08,h:0.18},{x:0.68,w:0.07,h:0.25},{x:0.76,w:0.09,h:0.20},{x:0.86,w:0.07,h:0.28},{x:0.94,w:0.06,h:0.16}];
  bldgs.forEach(b=>{
    const bx=b.x*W,bw=b.w*W,bh=b.h*H,by=gnd-bh;
    ctx.fillStyle='rgba(22,12,48,0.95)';ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='rgba(180,100,220,0.12)';ctx.lineWidth=0.5;ctx.strokeRect(bx,by,bw,bh);
    for(let wy=by+8;wy<gnd-10;wy+=13){
      for(let wx=bx+5;wx<bx+bw-5;wx+=10){
        if(Math.random()>0.55){ctx.fillStyle=Math.random()>0.75?'rgba(255,220,100,0.65)':'rgba(100,150,255,0.12)';ctx.fillRect(wx,wy,5,7);}
      }
    }
  });
  const road=ctx.createLinearGradient(0,gnd,0,H);
  road.addColorStop(0,'#120c28');road.addColorStop(1,'#0a0815');
  ctx.fillStyle=road;ctx.fillRect(0,gnd,W,H-gnd);
  ctx.strokeStyle='rgba(229,57,53,0.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,gnd);ctx.lineTo(W,gnd);ctx.stroke();
  ctx.strokeStyle='rgba(229,57,53,0.18)';ctx.lineWidth=1;ctx.setLineDash([22,14]);
  ctx.beginPath();ctx.moveTo(0,gnd+(H-gnd)*0.5);ctx.lineTo(W,gnd+(H-gnd)*0.5);ctx.stroke();
  ctx.setLineDash([]);
}
function drawPlayer(){
  const p=player;const py=p.y-p.h;
  ctx.save();
  const la=Math.sin(frame*0.28)*9;
  ctx.fillStyle='#1a237e';ctx.fillRect(p.x-10,p.y-12,8,14+la);ctx.fillRect(p.x+2,p.y-12,8,14-la);
  ctx.fillStyle='#333';ctx.fillRect(p.x-11,p.y+2,9,5);ctx.fillRect(p.x+2,p.y+2,9,5);
  ctx.fillStyle='#C62828';ctx.fillRect(p.x-14,py+18,28,p.h-28);
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('zomato',p.x,p.y-12);
  ctx.fillStyle='#a0522d';ctx.fillRect(p.x-9,py,18,20);
  ctx.fillStyle='#1a0a00';ctx.fillRect(p.x-10,py-2,20,9);ctx.fillRect(p.x-11,py,5,12);
  ctx.fillStyle='#b71c1c';ctx.fillRect(p.x-14,py+8,28,12);
  ctx.beginPath();ctx.arc(p.x,py+8,14,Math.PI,0);ctx.fill();
  ctx.fillStyle='#C62828';ctx.fillRect(p.x-20,py+18,8,20);ctx.fillRect(p.x+12,py+18,8,20);
  if(chaiShield){
    ctx.globalAlpha=0.35;ctx.strokeStyle='#FFC107';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y-p.h/2,32,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.08;ctx.fillStyle='#FFC107';
    ctx.beginPath();ctx.arc(p.x,p.y-p.h/2,32,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawObs(o){
  ctx.save();
  if(o.isPow){
    ctx.shadowColor=o.color;ctx.shadowBlur=14;ctx.fillStyle=o.color;
    ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2+4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 9px Courier New';ctx.textAlign='center';
    ctx.fillText(o.label,o.x+o.w/2,o.y+o.h/2+4);
  } else {
    ctx.fillStyle=o.color;ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(o.x,o.y,o.w,7);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 9px Courier New';ctx.textAlign='center';
    ctx.fillText(o.label,o.x+o.w/2,o.y-6);
    ctx.font='13px serif';ctx.fillText(o.emoji,o.x+o.w/2,o.y+o.h/2+6);
  }
  ctx.restore();
}
function collides(o){
  const px=player.x-11,pw=22,py_=player.y-player.h,ph=player.h;
  const ox=o.x+2,ow=o.w-4;
  return ox<px+pw&&ox+ow>px&&o.y<py_+ph-4&&o.y+o.h>py_+4;
}
function endGame(){
  gameRunning=false;cancelAnimationFrame(raf);
  const s=score;
  document.getElementById('end-score').textContent='SCORE: '+s+' | CGPA: '+Math.max(0,cgpa).toFixed(2);
  let tier,disc,extra;
  if(s>=600){tier='DU KA LEGEND';disc='60% OFF + FREE DELIVERY';extra='CGPA bonus unlocked: +0.5';}
  else if(s>=350){tier='CERTIFIED SURVIVOR';disc='40% OFF YOUR NEXT ORDER';extra='You earned your biryani, bhai';}
  else if(s>=150){tier='JUGAADU SCHOLAR';disc='25% OFF — CLAIM NOW';extra='Backlog cleared, barely survived';}
  else{tier='FIRST YEAR ENERGY';disc='15% OFF — KEEP TRYING';extra='Syllabus still loading...';}
  document.getElementById('rw-tier').textContent=tier;
  document.getElementById('rw-disc').textContent=disc;
  document.getElementById('rw-extra').textContent=extra;
  document.getElementById('endOverlay').style.display='flex';
}
function loop(){
  if(!gameRunning)return;
  raf=requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  drawBg();frame++;
  const gnd=H*GND_RATIO;
  const spd=5+(level-1)*0.6;
  player.vy+=0.72;player.y+=player.vy;
  if(player.y>=gnd){player.y=gnd;player.vy=0;player.onGround=true;jumpCount=0;}
  const obsRate=0.016+(level-1)*0.003;
  if(Math.random()<obsRate)spawnObs();
  if(Math.random()<0.007)spawnPow();
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=spd;
    if(o.x+o.w<-30){obstacles.splice(i,1);if(!o.isPow)score+=10;}
    else if(collides(o)){
      if(o.isPow){
        obstacles.splice(i,1);
        if(o.type==='zomato'){doubleJump=true;energy=Math.min(100,energy+30);showFloaty(o.x,o.y,'DOUBLE JUMP!','#E53935');addParticles(o.x,o.y,'#E53935',12);}
        else if(o.type==='chai'){chaiShield=true;shieldTimer=200;showFloaty(o.x,o.y,'CHAI SHIELD!','#FFC107');addParticles(o.x,o.y,'#FFC107',12);}
        else if(o.type==='cgpa'){cgpa=Math.min(10,cgpa+0.25);showFloaty(o.x,o.y,'CGPA +0.25!','#4CAF50');addParticles(o.x,o.y,'#4CAF50',12);}
        else if(o.type==='energy'){energy=Math.min(100,energy+40);showFloaty(o.x,o.y,'ENERGY +40!','#2196F3');addParticles(o.x,o.y,'#2196F3',12);}
        score+=20;
      } else {
        if(chaiShield){obstacles.splice(i,1);chaiShield=false;shieldTimer=0;showFloaty(player.x,player.y-player.h,'BLOCKED!','#FFC107');addParticles(player.x,player.y,'#FFC107',20);}
        else{
          obstacles.splice(i,1);cgpa=Math.max(0,cgpa+o.cgpaHit);energy=Math.max(0,energy-20);
          showFloaty(player.x,player.y-player.h,'CGPA '+o.cgpaHit.toFixed(2),'#EF5350');
          addParticles(player.x,player.y-player.h/2,'#EF5350',16);
          if(energy<=0){endGame();return;}
        }
      }
    }
  }
  if(shieldTimer>0){shieldTimer--;if(shieldTimer===0)chaiShield=false;}
  energy=Math.max(0,energy-0.035);
  if(energy<=0){endGame();return;}
  score++;if(score>0&&score%400===0)level++;
  obstacles.forEach(o=>drawObs(o));
  drawPlayer();
  ctx.save();
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.isTxt){
      ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.color;
      ctx.font='bold 12px Courier New';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);
    } else {
      ctx.globalAlpha=p.life/40;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);
    }
    if(p.life<=0)particles.splice(i,1);
  }
  ctx.globalAlpha=1;ctx.restore();
  updateHUD();
}
window.addEventListener('resize',()=>{if(gameRunning)resize();});
</script>
</body>
</html>
